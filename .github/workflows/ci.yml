name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # package.json and the README License section must name the Unlicense
      # in LICENSE, so they cannot drift from it.
      - name: Check license statements
        run: |
          fail=0
          grep -qF '"license": "Unlicense"' package.json \
            || { echo '::error file=package.json::Set "license": "Unlicense" to match LICENSE.'; fail=1; }
          grep -qxE '#+ License' README.md \
            || { echo '::error file=README.md::Add a License section.'; fail=1; }
          grep -qF '[Unlicense](LICENSE)' README.md \
            || { echo '::error file=README.md::Name and link the Unlicense: [Unlicense](LICENSE).'; fail=1; }
          exit "$fail"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mozilla's web-ext lint validates the manifest and packaged sources.
      # web-ext-config.cjs scopes it (and build/sign) to the shipped files.
      - name: Lint extension
        run: npm run lint
