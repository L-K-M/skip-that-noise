<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Import Blocked Artists</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
            max-width: 720px;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 12px 0;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"] {
            display: inline-block;
        }

        .status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
<h1>Import blocked artists</h1>
<div class="row">
    <input type="file" id="importFile" accept=".txt,text/plain"/>
</div>
<div class="hint">Choose a .txt file with one artist per line.</div>
<div id="status" class="status" style="display:none"></div>

<script src="import.js"></script>
</body>
</html>
